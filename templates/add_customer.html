{% extends "base.html" %}

{% block content %}
<div class="topbar">
  <div>
    <h1>Add New Customer</h1>
    <p class="muted">Register a new client in the system directory.</p>
  </div>
  <a class="btn btn-light" href="{{ url_for('customers') }}">Back to Directory</a>
</div>

<section class="panel" style="max-width: 600px;">
  <form method="POST">
    <div class="form-group">
      <label for="name">Customer Full Name</label>
      <input class="form-control" id="name" name="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input class="form-control" id="phone" name="phone" placeholder="919876543210" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address (Optional)</label>
      <input class="form-control" type="email" id="email" name="email" placeholder="john.doe@example.com">
    </div>
    <div class="form-group">
      <label for="notes">Additional Remarks / Notes</label>
      <textarea class="form-control" id="notes" name="notes" rows="4" placeholder="Frequent services, account balance details, etc..."></textarea>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn btn-primary" type="submit">Add Customer</button>
      <a class="btn btn-light" href="{{ url_for('customers') }}" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
