{% extends "base.html" %}

{% block content %}
<div class="topbar">
  <div>
    <h1>Edit Customer Details</h1>
    <p class="muted">Update personal information or notes for this client.</p>
  </div>
  <a class="btn btn-light" href="{{ url_for('customers') }}">Back to Directory</a>
</div>

<section class="panel" style="max-width: 600px;">
  <form method="POST">
    <div class="form-group">
      <label for="name">Customer Full Name</label>
      <input class="form-control" id="name" name="name" value="{{ customer.name }}" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input class="form-control" id="phone" name="phone" value="{{ customer.phone }}" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address (Optional)</label>
      <input class="form-control" type="email" id="email" name="email" value="{{ customer.email or '' }}">
    </div>
    <div class="form-group">
      <label for="notes">Additional Remarks / Notes</label>
      <textarea class="form-control" id="notes" name="notes" rows="4">{{ customer.notes or '' }}</textarea>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn btn-primary" type="submit">Update Customer</button>
      <a class="btn btn-light" href="{{ url_for('customers') }}" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
