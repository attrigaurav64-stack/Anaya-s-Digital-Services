{% extends "base.html" %}

{% block content %}
<div class="topbar">
  <div>
    <h1>Add Customer Query</h1>
    <p class="muted">Record a new request or order from a customer.</p>
  </div>
  <a class="btn btn-light" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</div>

<section class="panel" style="max-width: 800px;">
  <form method="POST">
    <div class="grid-2">
      <div class="form-group">
        <label for="customer_name">Customer Name</label>
        <input class="form-control" id="customer_name" name="customer_name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input class="form-control" id="phone" name="phone" placeholder="919876543210" required>
      </div>
    </div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="service_type">Service Type</label>
        <select class="form-select" id="service_type" name="service_type" required>
          <option value="">Select Service</option>
          {% for s in services %}
            <option value="{{ s.name }}" data-price="{{ s.price }}">{{ s.name }} (₹{{ s.price }})</option>
          {% endfor %}
          <option value="custom">Other / Custom</option>
        </select>
      </div>
      <div class="form-group">
        <label for="priority">Priority</label>
        <select class="form-select" id="priority" name="priority">
          <option>Normal</option>
          <option>High</option>
          <option>Urgent</option>
        </select>
      </div>
    </div>
    
    <div class="form-group">
      <label for="message">Customer Query / Description</label>
      <textarea class="form-control" id="message" name="message" rows="4" placeholder="Detail the query or instructions here..." required></textarea>
    </div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="amount">Estimated Amount (₹)</label>
        <input class="form-control" type="number" step="0.01" id="amount" name="amount" value="0">
      </div>
      <div class="form-group">
        <label for="payment_method">Payment Method</label>
        <select class="form-select" id="payment_method" name="payment_method" required>
          <option value="Cash">Cash</option>
          <option value="UPI">UPI / QR Scan</option>
          <option value="Online">Online Transfer</option>
          <option value="Card">Card Payment</option>
        </select>
      </div>
    </div>
    
    <div class="form-group">
      <label for="notes">Staff Notes / Reference Info</label>
      <input class="form-control" id="notes" name="notes" placeholder="Internal remarks...">
    </div>
    
    <div style="margin-top: 10px;">
      <button class="btn btn-primary" type="submit">Save Query</button>
      <a class="btn btn-light" href="{{ url_for('dashboard') }}" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const serviceSelect = document.getElementById('service_type');
    const amountInput = document.getElementById('amount');
    
    serviceSelect.addEventListener('change', function() {
      const selectedOption = this.options[this.selectedIndex];
      if (selectedOption && this.value !== "" && this.value !== "custom") {
        const price = parseFloat(selectedOption.getAttribute('data-price')) || 0;
        amountInput.value = price.toFixed(2);
      } else if (this.value === "custom") {
        amountInput.value = "0.00";
      }
    });
  });
</script>
{% endblock %}
