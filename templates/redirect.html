<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening WhatsApp...</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <meta http-equiv="refresh" content="2;url={{ target_url }}">
</head>
<body class="auth-body">
  <div class="login-card" style="text-align: center;">
    <div class="brand-circle">💬</div>
    <h2>Redirecting to WhatsApp</h2>
    <p class="muted" style="margin-bottom: 24px;">Please wait while we prepare your chat window...</p>
    
    <div style="margin: 20px auto; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    
    <p style="font-size: 13px; color: var(--text-muted);">
      If the page doesn't redirect automatically in a few seconds, 
      <a href="{{ target_url }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">click here to open chat</a>.
    </p>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
