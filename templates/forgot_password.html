<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - {{ cafe_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo-container">
        <img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
      </div>
      <h2 style="background: linear-gradient(135deg, #be123c 0%, #fb7185 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; font-size: 28px; letter-spacing: -0.5px; margin-top: 10px; display: inline-block;">Account Recovery</h2>
      <p class="muted">Enter details to receive your recovery OTP</p>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form method="POST">
      <div class="form-group">
        <label for="username">Staff Login Username</label>
        <input class="form-control" type="text" id="username" name="username" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label for="email">Registered Email Address</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="staff@example.com" required>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" type="submit">Send OTP</button>
      <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('login') }}" style="color: var(--primary); font-size: 13px; text-decoration: none; font-weight: 600;">Back to Login</a>
      </div>
    </form>
  </div>
</body>
</html>
