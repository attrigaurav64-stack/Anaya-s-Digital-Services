{% extends "base.html" %}

{% block content %}
<div class="topbar">
  <div>
    <h1>Add Staff Member</h1>
    <p class="muted">Add employee profile details to the business roster.</p>
  </div>
  <a class="btn btn-light" href="{{ url_for('staff') }}">Back to Directory</a>
</div>

<section class="panel" style="max-width: 600px;">
  <form method="POST">
    <div class="form-group">
      <label for="name">Staff Full Name</label>
      <input class="form-control" id="name" name="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="role">Role / Designation</label>
      <select class="form-select" id="role" name="role" required>
        <option value="Manager">Cafe Manager</option>
        <option value="Operator">System Operator / Support</option>
        <option value="Designer">Graphics Designer / Typist</option>
        <option value="Technician">Hardware Technician</option>
        <option value="Helper">Utility Helper</option>
      </select>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input class="form-control" id="phone" name="phone" placeholder="919876543210" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input class="form-control" type="email" id="email" name="email" placeholder="staff@example.com" required>
    </div>
    <div class="form-group">
      <label for="salary">Monthly Base Salary (₹)</label>
      <input class="form-control" type="number" step="0.01" id="salary" name="salary" placeholder="15000.00" required>
    </div>

    <h3 style="font-size: 16px; margin: 25px 0 12px; font-weight: 700; border-bottom: 1px solid var(--card-border); padding-bottom: 8px;">Staff Login Credentials</h3>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="username">Login Username</label>
        <input class="form-control" id="username" name="username" placeholder="john_staff">
      </div>
      <div class="form-group">
        <label for="password">Login Password</label>
        <div class="password-group">
          <input class="form-control" type="password" id="password" name="password" placeholder="••••••••">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility(this)">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>
      </div>
    </div>

    <h3 style="font-size: 16px; margin: 25px 0 12px; font-weight: 700; border-bottom: 1px solid var(--card-border); padding-bottom: 8px;">Access Control Permissions</h3>
    
    <div class="form-group">
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px;">
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="customers" checked> Customers Directory
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="queries" checked> Inquiries & Orders
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="jobs" checked> Jobs & Tokens
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="services" checked> Services & Prices
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="payments"> Payment Logs
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="invoices"> Invoices
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="expenses"> Expenses Tracking
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="whatsapp"> WhatsApp Inbox
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="qr_codes"> QR Codes Generator
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="reports"> Reports & Analytics
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="staff"> Staff Management
        </label>
        <label style="font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="permissions[]" value="settings"> Cafe Settings
        </label>
      </div>
    </div>
    
    <div style="margin-top: 30px;">
      <button class="btn btn-primary" type="submit">Add Employee</button>
      <a class="btn btn-light" href="{{ url_for('staff') }}" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
