{% extends "base.html" %}

{% block content %}
<div class="topbar">
  <div>
    <h1>Edit Job / Session Token Details</h1>
    <p class="muted">Modify duration, charges, or status for this token.</p>
  </div>
  <a class="btn btn-light" href="{{ url_for('jobs') }}">Back to Active Jobs</a>
</div>

<section class="panel" style="max-width: 700px;">
  <form method="POST">
    <div class="grid-2">
      <div class="form-group">
        <label for="token_code">Token Code</label>
        <input class="form-control" id="token_code" value="{{ job.token_code }}" readonly style="font-family: monospace; font-weight: 700; background-color: #f1f5f9; color: var(--text-muted);">
      </div>
      <div class="form-group">
        <label for="customer_name">Customer Name</label>
        <input class="form-control" id="customer_name" name="customer_name" value="{{ job.customer_name }}" required>
      </div>
    </div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="pc_number">Device / PC Assignment</label>
        <input class="form-control" id="pc_number" name="pc_number" value="{{ job.pc_number }}" required>
      </div>
      <div class="form-group">
        <label for="service_type">Service Category</label>
        <input class="form-control" id="service_type" name="service_type" value="{{ job.service_type }}" required>
      </div>
    </div>
    
    <div class="grid-2">
      <div class="form-group">
        <label for="duration_mins">Duration (Minutes)</label>
        <input class="form-control" type="number" id="duration_mins" name="duration_mins" value="{{ job.duration_mins }}" min="0" required>
      </div>
      <div class="form-group">
        <label for="cost">Assigned Rate / Charge (₹)</label>
        <input class="form-control" type="number" step="0.1" id="cost" name="cost" value="{{ job.cost }}" min="0" required>
      </div>
    </div>

    <div class="form-group">
      <label for="status">Session Status</label>
      <select class="form-select" id="status" name="status" required>
        <option value="Active" {% if job.status == 'Active' %}selected{% endif %}>Active</option>
        <option value="Completed" {% if job.status == 'Completed' %}selected{% endif %}>Completed</option>
        <option value="Cancelled" {% if job.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
      </select>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn btn-primary" type="submit">Update Session Details</button>
      <a class="btn btn-light" href="{{ url_for('jobs') }}" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
