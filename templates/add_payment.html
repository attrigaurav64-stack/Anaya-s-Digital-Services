{% extends "base.html" %}

{% block content %}
<div class="topbar">
  <div>
    <h1>Log New Payment</h1>
    <p class="muted">Record a manual payment transaction received from a customer.</p>
  </div>
  <a class="btn btn-light" href="{{ url_for('payments') }}">Back to Payments Log</a>
</div>

<section class="panel" style="max-width: 600px;">
  <form method="POST">
    <div class="form-group">
      <label for="customer_name">Customer Full Name</label>
      <input class="form-control" id="customer_name" name="customer_name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label for="amount">Amount Received (₹)</label>
      <input class="form-control" type="number" step="0.01" id="amount" name="amount" placeholder="100.00" required>
    </div>
    <div class="form-group">
      <label for="payment_method">Payment Mode</label>
      <select class="form-select" id="payment_method" name="payment_method" required>
        <option value="Cash">Cash</option>
        <option value="UPI">UPI / GooglePay / PhonePe</option>
        <option value="Card">Debit / Credit Card</option>
      </select>
    </div>
    <div class="form-group">
      <label for="notes">Notes / Reference Details (Optional)</label>
      <textarea class="form-control" id="notes" name="notes" rows="4" placeholder="Transaction ID, specific services paid for, etc..."></textarea>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn btn-primary" type="submit">Log Payment</button>
      <a class="btn btn-light" href="{{ url_for('payments') }}" style="margin-left: 8px;">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
