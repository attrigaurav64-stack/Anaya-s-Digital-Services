<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - {{ cafe_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo-container">
        <img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
      </div>
      <h2 style="background: linear-gradient(135deg, #be123c 0%, #fb7185 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; font-size: 28px; letter-spacing: -0.5px; margin-top: 10px; display: inline-block;">New Password</h2>
      <p class="muted">Enter and confirm your new account password</p>
    </div>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form method="POST">
      <div class="form-group">
        <label for="password">New Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="Enter new password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" type="submit">Reset Password</button>
    </form>
  </div>
</body>
</html>
